name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.1.0
          pip install torch-geometric==2.5 torch-scatter torch-sparse \
            -f https://data.pyg.org/whl/torch-2.1.0+cpu.html
          pip install .[dev]

      - name: Ruff format
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for tokenless Codecov upload via OIDC
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.1.0
          pip install torch-geometric==2.5 torch-scatter torch-sparse \
            -f https://data.pyg.org/whl/torch-2.1.0+cpu.html
          pip install .[dev]

      - name: Run tests
        run: pytest -v -m "not slow" --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          use_oidc: true
