name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11"
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create environment and install development dependencies
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]" --torch-backend=cpu

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for tokenless Codecov upload via OIDC
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create environment and install development dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]" --torch-backend=cpu

      - name: Run tests
        run: uv run --no-sync pytest -v -m "not slow" --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          use_oidc: true

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci
